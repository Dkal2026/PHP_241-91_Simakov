<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Storage Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0f172a; /* Глубокий темный цвет */
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            margin-bottom: 40px;
            border-left: 4px solid #38bdf8;
            padding-left: 20px;
        }

        header h1 { font-size: 2rem; letter-spacing: -1px; }
        header p { color: #94a3b8; margin-top: 5px; }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .folder-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .folder-card:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .folder-name {
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
        }

        .file-count {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Цвета иконок для красоты */
        .blue { color: #38bdf8; }
        .amber { color: #fbbf24; }
        .rose { color: #fb7185; }
        .emerald { color: #34d399; }
    </style>
</head>
